server:
  port: 80

spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    username: "${username}"
    password: "${password}"
    url: "${url}"

  sql.init.mode: always

  servlet:
    multipart:
      max-request-size: 30MB
      max-file-size: 30MB

  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate.ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        use_sql_comments: true
        format_sql: false
    generate-ddl: false

  elasticsearch:
    username: "${spring.elasticsearch.username}"
    password: "${spring.elasticsearch.password}"
    uris: "${spring.elasticsearch.uris}"

caPath: "${caPath}"

cloud:
  aws:
    credentials:
      accessKey: "${cloud.aws.credentials.accessKey}"
      secretKey: "${cloud.aws.credentials.secretKey}"
    s3:
      bucketName: "${cloud.aws.s3.bucketName}"
    region:
      static:
    stack:
      auto: false

logging:
  level:
    org:
      elasticsearch:
        client: debug
      springframework:
        data:
          elasticsearch:
            client: debug
      hibernate:
        type:
          descriptor:
            sql: trace
    root: info
    dev.ioexception: info
  file:
    name: "${logging.file.name}"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    metrics:
      enabled: true
